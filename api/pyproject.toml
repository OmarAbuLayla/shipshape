[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shipshape-api"
version = "0.1.0"
description = "Local web API for Shipshape: start scans, follow progress, read reports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Omar Abulayla" }]
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "shipshape",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "mypy>=1.11", "pytest>=8.3", "ruff>=0.17"]

[project.scripts]
shipshape-api = "shipshape_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shipshape_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["shipshape_api"]

[[tool.mypy.overrides]]
module = ["radon.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
