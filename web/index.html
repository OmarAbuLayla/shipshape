<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shipshape</title>
    <meta name="description" content="Code is cheap now. Judgment isn't. Shipshape reviews vibe-coded Python projects." />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="alternate icon" href="/brand/favicon.ico" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <script>
      // Apply the saved theme before first paint, so there is no flash of the wrong theme.
      try {
        const t = localStorage.getItem("shipshape-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
