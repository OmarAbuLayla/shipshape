# The heart_risk test project (Shipshape's first plugin test): a seminar ML project
# predicting heart-disease risk from repeated patient visits. Planted problems:
# patient leakage in the split, a hard-coded key, a bare except, `labs == None` on a
# DataFrame (crashes), a mutable default that is appended to, machine paths, no seeds,
# an import cycle, loop closures, a star import, a renamed copy of the data package
# (data_old) and a single small test.
# Known blind spots, deliberately NOT expected: leakage through preprocessing fitted on
# all rows (data/cleaning.py), the `global`
# cache without rebinding, and model.build() silently falling back to XGBoost.
