[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shipshape"
version = "0.1.0"
description = "Static analysis engine that finds what an engineer would object to in a vibe-coded Python project."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Omar Abulayla" }]
dependencies = [
    "mcp>=2.3,<3",
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "radon>=6.0",
    "rich>=13.7",
    "ruff>=0.17",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
shipshape = "shipshape.cli:app"
shipshape-mcp = "shipshape.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shipshape"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The corpus is deliberately bad code; linting it would "fix" the test data.
extend-exclude = ["corpus"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["shipshape"]

[[tool.mypy.overrides]]
module = ["radon.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
